spring.application.name=cache-demo
server.port=8080

# Base de datos H2 en memoria (se crea y se llena sola cada vez que arranca la app)
spring.datasource.url=jdbc:h2:mem:tienda;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Cuántos registros generar (sube o baja según qué tan potente sea tu PC)
app.registros=300000

# Pon false para ver el error de CORS en el navegador
app.cors.habilitado=true
